services:

  mysql:
    image: mysql:8.4
    container_name: product-api-db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: productdb
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: product-api-app
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      DB_URL: jdbc:mysql://mysql:3306/productdb?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_DRIVER: com.mysql.cj.jdbc.Driver

      DDL_AUTO: update
      SHOW_SQL: false

      JWT_SECRET: change-this-super-secret-key-min-32-characters-long-for-hs256
      JWT_ACCESS_EXPIRATION_MS: 900000
      JWT_REFRESH_EXPIRATION_MS: 604800000

      SERVER_PORT: 8080

    ports:
      - "8080:8080"

volumes:
  mysql_data: